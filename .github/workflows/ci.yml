name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command cargo fmt --all -- --check
      - run: nix develop --command cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - run: nix develop --command cargo test --workspace --all-targets --locked --no-default-features
      - run: nix develop --command cargo test -p mote-cube --features cpu --locked
